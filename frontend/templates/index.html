<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Evaluation Platform</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter font for Shadcn UI -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
        --card: 0 0% 100%;
        --card-foreground: 222.2 84% 4.9%;
        --popover: 0 0% 100%;
        --popover-foreground: 222.2 84% 4.9%;
        --primary: 222.2 47.4% 11.2%;
        --primary-foreground: 210 40% 98%;
        --secondary: 210 40% 96.1%;
        --secondary-foreground: 222.2 47.4% 11.2%;
        --muted: 210 40% 96.1%;
        --muted-foreground: 215.4 16.3% 46.9%;
        --accent: 210 40% 96.1%;
        --accent-foreground: 222.2 47.4% 11.2%;
        --destructive: 0 84.2% 60.2%;
        --destructive-foreground: 210 40% 98%;
        --border: 214.3 31.8% 91.4%;
        --input: 214.3 31.8% 91.4%;
        --ring: 222.2 84% 4.9%;
        --radius: 0.5rem;
      }

      .dark {
        --background: 222.2 84% 4.9%;
        --foreground: 210 40% 98%;
        --card: 222.2 84% 4.9%;
        --card-foreground: 210 40% 98%;
        --popover: 222.2 84% 4.9%;
        --popover-foreground: 210 40% 98%;
        --primary: 210 40% 98%;
        --primary-foreground: 222.2 47.4% 11.2%;
        --secondary: 217.2 32.6% 17.5%;
        --secondary-foreground: 210 40% 98%;
        --muted: 217.2 32.6% 17.5%;
        --muted-foreground: 215 20.2% 65.1%;
        --accent: 217.2 32.6% 17.5%;
        --accent-foreground: 210 40% 98%;
        --destructive: 0 62.8% 30.6%;
        --destructive-foreground: 210 40% 98%;
        --border: 217.2 32.6% 17.5%;
        --input: 217.2 32.6% 17.5%;
        --ring: 212.7 26.8% 83.9%;
      }

      * {
        border-color: hsl(var(--border));
      }

      body {
        font-feature-settings: "rlig" 1, "calt" 1;
        font-family: var(--font-sans);
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
      }

      .model-response {
        @apply mb-2;
      }

      .factuality-score,
      .response-time {
        @apply pt-2 border-t text-sm text-muted-foreground;
      }
    </style>
  </head>
  <body class="min-h-screen p-4 md:p-6 lg:p-8 bg-background text-foreground">
    <div class="max-w-7xl mx-auto">
      <!-- Banner -->
      <div
        class="flex justify-between items-center bg-card p-6 rounded-lg shadow-sm mb-8"
      >
        <h1 class="text-2xl font-bold">LLM Evaluation Platform</h1>
        <a
          href="{{ url_for('experiments') }}"
          class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2"
        >
          Experiments
        </a>
      </div>

      <!-- Experiment Creation Section -->
      <div class="bg-card rounded-lg shadow-sm p-6 mb-8">
        <h2 class="text-xl font-semibold mb-6">New Experiment</h2>
        <form
          id="experimentForm"
          method="post"
          action="{{ url_for('submit_prompt') }}"
        >
          <div class="mb-4 space-y-2">
            <label
              for="experimentName"
              class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70"
              >Experiment Name</label
            >
            <input
              type="text"
              class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
              id="experimentName"
              name="experiment_name"
              value="{{ experiment.name if experiment else '' }}"
              required
            />
          </div>

          <div class="mb-4 space-y-2">
            <label
              for="systemPrompt"
              class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70"
              >System Prompt</label
            >
            <textarea
              class="flex min-h-[80px] w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
              id="systemPrompt"
              name="system_prompt"
              rows="4"
              required
            >
{{ experiment.system_prompt if experiment else '' }}</textarea
            >
          </div>

          <div class="mb-6 space-y-2">
            <label class="text-sm font-medium leading-none"
              >Select Models</label
            >
            <div id="modelSelection" class="space-y-2">
              <!-- Commenting out the GPT checkbox -->
              <!--
              <div class="flex items-center space-x-2">
                  <input class="h-4 w-4 rounded border-border text-primary focus:ring-primary" type="checkbox" value="GPT-3.5 Turbo" id="gptCheckbox">
                  <label class="text-sm font-medium leading-none" for="gptCheckbox">
                      GPT-3.5 Turbo
                  </label>
              </div>
              -->
              <div class="flex items-center space-x-2">
                <input
                  class="h-4 w-4 rounded border-border text-primary focus:ring-primary"
                  type="checkbox"
                  value="Gemini"
                  id="geminiCheckbox"
                />
                <label
                  class="text-sm font-medium leading-none"
                  for="geminiCheckbox"
                >
                  Gemini
                </label>
              </div>
              <div class="flex items-center space-x-2">
                <input
                  class="h-4 w-4 rounded border-border text-primary focus:ring-primary"
                  type="checkbox"
                  value="Mistral"
                  id="mistralCheckbox"
                />
                <label
                  class="text-sm font-medium leading-none"
                  for="mistralCheckbox"
                >
                  Mistral
                </label>
              </div>
              <div class="flex items-center space-x-2">
                <input
                  class="h-4 w-4 rounded border-border text-primary focus:ring-primary"
                  type="checkbox"
                  value="Llama"
                  id="llamaCheckbox"
                />
                <label
                  class="text-sm font-medium leading-none"
                  for="llamaCheckbox"
                >
                  Llama
                </label>
              </div>
            </div>
          </div>

          <div class="flex gap-2">
            <button
              type="submit"
              class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2"
            >
              Run Experiment
            </button>
          </div>
        </form>
      </div>

      <!-- Results Section -->
      <div
        class="bg-card rounded-lg shadow-sm p-6 mb-8"
        id="results-section"
        style="display: none"
      >
        <h2 class="text-xl font-semibold mb-6">Results</h2>
        <div class="overflow-x-auto">
          <table class="w-full border-collapse">
            <thead>
              <tr class="border-b">
                <!-- Headers will be dynamically populated -->
              </tr>
            </thead>
            <tbody id="resultsBody">
              <!-- Results will be populated here -->
            </tbody>
          </table>
        </div>
        <div class="flex gap-2 mt-6">
          <button
            type="button"
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-secondary text-secondary-foreground hover:bg-secondary/80 h-10 px-4 py-2"
            id="addTestCase"
          >
            Add Test Case
          </button>
          <button
            type="button"
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2"
            id="submitTestCases"
          >
            Submit Test Case
          </button>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      $(document).ready(function () {
        // Handle Run Experiment button click
        $("#experimentForm").submit(function (event) {
          event.preventDefault();

          const experimentName = $("#experimentName").val().trim();
          const systemPrompt = $("#systemPrompt").val().trim();
          const selectedModels = [];
          $("#modelSelection input:checked").each(function () {
            selectedModels.push($(this).val());
          });

          // Get existing experiment ID if it exists
          const experimentId = window.currentExperimentId || null;

          // Validation checks...
          if (!experimentName || !systemPrompt || selectedModels.length === 0) {
            alert("Please fill in all fields and select at least one model.");
            return;
          }

          // Submit the form data via AJAX
          $.ajax({
            url: "{{ url_for('submit_prompt') }}",
            type: "POST",
            data: {
              experiment_name: experimentName,
              system_prompt: systemPrompt,
              selected_models: selectedModels,
              experiment_id: experimentId, // Pass the experiment ID if it exists
            },
            success: function (response) {
              alert(response.message);
              window.currentExperimentId = response.experiment_id;
              window.selectedModels = selectedModels;

              // Show and initialize results section
              $("#results-section").show();
              initializeResultsTable(selectedModels);

              // Load existing responses if any
              if (
                response.existing_responses &&
                response.existing_responses.length > 0
              ) {
                loadExistingResponses(response.existing_responses);
              }
            },
            error: function (xhr, status, error) {
              console.error("Error:", error);
              alert(
                "An error occurred while creating/updating the experiment."
              );
            },
          });
        });

        // Function to initialize results table
        function initializeResultsTable(selectedModels) {
          const resultsTable = $("#results-section table");
          resultsTable.empty();

          // Create and append thead with headers
          const thead = $("<thead></thead>");
          const headerRow = $("<tr></tr>");
          headerRow.append(
            "<th class='p-3 text-left font-medium'>Test Case</th>"
          );
          headerRow.append(
            "<th class='p-3 text-left font-medium'>Expected Output</th>"
          );
          selectedModels.forEach((model) => {
            headerRow.append(
              `<th class='p-3 text-left font-medium'>${model}</th>`
            );
          });
          headerRow.append(
            "<th class='p-3 text-left font-medium'>Actions</th>"
          );
          thead.append(headerRow);
          resultsTable.append(thead);

          // Create and append tbody
          const tbody = $("<tbody id='resultsBody'></tbody>");
          resultsTable.append(tbody);
        }

        // Function to load existing responses
        function loadExistingResponses(responses) {
          const resultsBody = $("#resultsBody");
          responses.forEach((response) => {
            const row = $("<tr class='border-b hover:bg-muted/50'></tr>");
            row.append(
              `<td contenteditable='true' class='p-3 align-middle'>${response.test_case}</td>`
            );
            row.append(
              `<td contenteditable='true' class='p-3 align-middle'>${response.expected_output}</td>`
            );

            window.selectedModels.forEach((model) => {
              const modelResponse = response[model] || "";
              const factuality = response[`${model}_factuality`] || "";
              row.append(`
                            <td class='p-3 align-middle'>
                              <div class='model-response'>${modelResponse}</div>
                              <div class='factuality-score'>
                                Factuality Score: ${factuality}
                              </div>
                            </td>
                          `);
            });

            row.append(`
                          <td class='p-3 align-middle'>
                            <button class='inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-destructive text-destructive-foreground hover:bg-destructive/90 h-9 px-3 delete-test-case'>Delete</button>
                          </td>
                        `);
            resultsBody.append(row);
          });
        }

        // Update Add Test Case button to use stored selected models
        $("#addTestCase").click(function () {
          if (!window.selectedModels) {
            alert("Please run an experiment first.");
            return;
          }

          const newRow = $("<tr class='border-b hover:bg-muted/50'></tr>");
          newRow.append(
            "<td contenteditable='true' class='p-3 align-middle'></td>"
          );
          newRow.append(
            "<td contenteditable='true' class='p-3 align-middle'></td>"
          );
          window.selectedModels.forEach(() => {
            newRow.append("<td class='p-3 align-middle'></td>");
          });
          newRow.append(`
                        <td class='p-3 align-middle'>
                          <button class='inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-destructive text-destructive-foreground hover:bg-destructive/90 h-9 px-3 delete-test-case'>Delete</button>
                        </td>
                      `);
          $("#resultsBody").append(newRow);
        });

        // Handle Delete Test Case button click
        $(document).on("click", ".delete-test-case", function () {
          $(this).closest("tr").remove();
        });

        // Handle Submit Test Case button click
        $("#submitTestCases").click(function () {
          const lastRow = $("#resultsBody tr").last();
          const testCase = lastRow.find("td:eq(0)").text().trim();
          const expectedOutput = lastRow.find("td:eq(1)").text().trim();
          const systemPrompt = $("#systemPrompt").val().trim();

          if (!testCase || !expectedOutput) {
            alert(
              "Please ensure the last test case and expected output are filled."
            );
            return;
          }

          if (!systemPrompt) {
            alert("Please provide a system prompt.");
            return;
          }

          $.ajax({
            url: "{{ url_for('evaluate_test_cases') }}",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({
              test_cases: [{ testCase, expectedOutput }],
              system_prompt: systemPrompt,
              selected_models: $("#modelSelection input:checked")
                .map(function () {
                  return $(this).val();
                })
                .get(),
            }),
            success: function (response) {
              updateResults(response.responses, expectedOutput);
            },
          });
        });

        // Function to update results table
        function updateResults(responses, expectedOutput) {
          const resultsBody = $("#resultsBody");
          resultsBody.empty();
          responses.forEach(function (res) {
            const row = $("<tr class='border-b hover:bg-muted/50'></tr>");
            row.append(`<td class='p-3 align-middle'>${res.test_case}</td>`);
            row.append(
              `<td class='p-3 align-middle'>${res.expected_output}</td>`
            );
            window.selectedModels.forEach((model) => {
              const modelResponse = res[model] || "";
              const factuality = calculateFactuality(
                modelResponse,
                expectedOutput
              );
              const responseTime = res[`${model}_response_time`] || "N/A";
              row.append(`
                            <td class='p-3 align-middle'>
                              <div class='model-response'>${modelResponse}</div>
                              <div class='factuality-score'>
                                Factuality Score: ${factuality}%
                              </div>
                              <div class='response-time'>
                                Response Time: ${responseTime}
                              </div>
                            </td>
                          `);
            });
            row.append(`
                          <td class='p-3 align-middle'>
                            <button class='inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-destructive text-destructive-foreground hover:bg-destructive/90 h-9 px-3 delete-test-case'>Delete</button>
                          </td>
                        `);
            resultsBody.append(row);
          });
        }

        // Function to calculate factuality
        function calculateFactuality(response, expectedOutput) {
          // Normalize the text: convert to lowercase and remove punctuation
          const normalize = (text) => {
            return text.toLowerCase().replace(/[^\w\s]/g, "");
          };

          const normalizedResponse = normalize(response);
          const normalizedExpected = normalize(expectedOutput);

          // Split into words
          const responseWords = normalizedResponse.split(/\s+/).filter(Boolean);
          const expectedWords = normalizedExpected.split(/\s+/).filter(Boolean);

          if (expectedWords.length === 0) return 0;

          // Calculate exact matches
          const exactMatches = responseWords.filter((word) =>
            expectedWords.includes(word)
          ).length;

          // Calculate partial matches using substring comparison
          let partialMatches = 0;
          responseWords.forEach((respWord) => {
            if (!expectedWords.includes(respWord)) {
              expectedWords.forEach((expWord) => {
                if (expWord.includes(respWord) || respWord.includes(expWord)) {
                  partialMatches += 0.5; // Award half points for partial matches
                }
              });
            }
          });

          // Calculate final score
          const score = Math.min(
            100,
            ((exactMatches + partialMatches) / expectedWords.length) * 100
          );

          // Ensure score is between 0 and 100
          return Math.max(0, Math.min(100, score)).toFixed(2);
        }

        // Add this function to load existing experiment data
        function loadExistingExperiment(experimentId) {
          $.ajax({
            url: `/experiment/${experimentId}`,
            type: "GET",
            success: function (response) {
              // Set form values
              $("#experimentName").val(response.experiment.name);
              $("#systemPrompt").val(response.experiment.system_prompt);

              // Check corresponding model checkboxes
              response.experiment.selected_models.forEach((model) => {
                $(`input[name="models"][value="${model}"]`).prop(
                  "checked",
                  true
                );
              });

              // Store experiment data
              window.currentExperimentId = response.experiment.id;
              window.selectedModels = response.experiment.selected_models;

              // Show results section
              $("#results-section").show();

              // Initialize and populate results table
              initializeResultsTable(response.experiment.selected_models);
              if (response.responses.length > 0) {
                loadExistingResponses(response.responses);
              }
            },
            error: function (xhr, status, error) {
              console.error("Error loading experiment:", error);
              alert("Failed to load experiment data");
            },
          });
        }

        // Call this function when loading a continued experiment
        if (window.initialExperimentId) {
          loadExistingExperiment(window.initialExperimentId);
        }
      });
    </script>
  </body>
</html>
